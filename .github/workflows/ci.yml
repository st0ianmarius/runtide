name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines floor (Node 22) and the current LTS.
        node: ['22', 'lts/*']
    env:
      SKIP_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run docs:check
      - run: npm run build
      - run: npm run knip
      - name: browser bundle (src must not reach for Node built-ins)
        run: npm run bundle:check

  bench:
    # The benchmarks on every push to master, on one fixed machine type, kept as an artifact beside the baseline
    # (bench/BASELINE.md). They report; they do not fail the build until CI sets budgets from their history.
    name: bench
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    env:
      SKIP_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run bench | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: bench.txt
